<!DOCTYPE html>
<html dir="rtl" lang="fa" data-public-page="1">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به کارگاه</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .login-card { width: min(440px, 100%); }
        .login-card h1 { font-size: 24px; margin-bottom: 8px; }
        .login-card p { color: var(--c-muted); margin-bottom: 18px; line-height: 1.7; }
        .login-card label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
        .login-card input { width: 100%; padding: 10px 12px; }
        .login-card button { width: 100%; justify-content: center; margin-top: 18px; padding: 12px; }
        .err { color: var(--c-rose); min-height: 1.4em; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card login-card">
        <h1>ورود به کارگاه</h1>
        <p>حساب را ادمین می‌سازد. دانش‌آموزان ثبت‌نام نمی‌کنند؛ نام و تیم را همین‌جا وارد کنید.</p>
        <form id="loginForm">
            <label>نام کاربری</label>
            <input id="username" autocomplete="username" required>
            <label>رمز عبور</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <label>نام دانش‌آموز</label>
            <input id="name" autocomplete="name" placeholder="برای ادمین اختیاری">
            <label>نام تیم</label>
            <input id="team" placeholder="برای ادمین اختیاری">
            <div class="err" id="err"></div>
            <button class="primary" type="submit">ورود</button>
        </form>
    </div>
    <script src="workshop.js"></script>
    <script>
        if (Workshop.token()) location.href = 'index.html';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('err');
            err.textContent = '';
            try {
                await Workshop.login(
                    document.getElementById('username').value,
                    document.getElementById('password').value,
                    document.getElementById('name').value,
                    document.getElementById('team').value
                );
                location.href = 'index.html';
            } catch (ex) {
                err.textContent = ex.message || String(ex);
            }
        });
    </script>
</body>
</html>
