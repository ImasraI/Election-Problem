<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استیت ۶.۴ – حذف تدریجی</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h2 class="cond-title">روش حذف تدریجی (هر)</h2>
        <div id="chart"></div>
        <div class="card">
            <div id="candBar"></div>
            <div id="adder"></div>
            <div class="row" style="margin-top:10px;">
                <button class="outline" id="beforeBtn" type="button">قبل از بالا بردن A</button>
                <button class="outline" id="afterBtn" type="button">بعد از بالا بردن A</button>
                <button class="outline" id="resetBtn" type="button" style="color:#ff5d7d;">حذف همه</button>
            </div>
            <div class="grid-2" style="margin-top:12px;">
                <div>
                    <div class="card-header"><span>رأی‌دهندگان</span><span class="badge" id="voterCount">۰</span></div>
                    <div class="voter-list" id="voterList"></div>
                </div>
                <div>
                    <div id="out"></div>
                    <div id="rounds"></div>
                    <div class="graph-wrap"><canvas id="graphCanvas" width="460" height="460"></canvas></div>
                    <div class="graph-legend" id="graphLegend"></div>
                    <div id="bars"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script>
        const M = Mentor;
        const SEVEN = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
        const before = M.expandGroups([
            { n: 5, rank: 'A>B>C>D>E>F>G' },
            { n: 6, rank: 'B>C>A>D>E>F>G' },
            { n: 4, rank: 'C>A>B>D>E>F>G' }
        ]);
        const after = M.expandGroups([
            { n: 7, rank: 'A>B>C>D>E>F>G' },
            { n: 4, rank: 'B>C>A>D>E>F>G' },
            { n: 4, rank: 'C>A>B>D>E>F>G' }
        ]);
        M.renderCriteriaChart(document.getElementById('chart'), {
            AAW: true, CWC: false, UNAN: true, MONO: false, IIA: false
        }, {
            title: 'نمودار ازپیش‌آماده‌شده',
            examples: [
                { rule: 'MONO', title: 'بالا بردن A باعث باخت A می‌شود', ballots: ['قبل: A برنده است', 'بعد: دو نفر A را بالاتر می‌گذارند و C برنده می‌شود'], result: 'وضعیت A بهتر شد، جایگاه نهایی‌اش بدتر شد.', why: 'یکنوایی نقض می‌شود.' },
                { rule: 'CWC', title: 'ممکن است برنده کندورسه حذف شود', ballots: ['نامزدی که دونفره همه را می‌برد، رأی اول کمی دارد'], result: 'زود کنار می‌رود.', why: 'معیار کندورسه تضمین نیست.' },
                { rule: 'IIA', title: 'نامزد سوم مسیر حذف را عوض می‌کند', ballots: ['A در برابر B ثابت', 'جای C عوض می‌شود'], result: 'برنده نهایی عوض می‌شود.', why: 'استقلال نقض می‌شود.' }
            ]
        });
        function roundsHtml(hr) {
            return (hr.rounds || []).map(r => {
                const votes = (r.active || []).map(c =>
                    `<span class="cand-vote">${c}: <span class="count">${r.counts[c] || 0}</span></span>`
                ).join('');
                const tail = r.eliminatedThis
                    ? `<div class="eliminated">حذف کم‌رأی‌ترین: ${r.eliminatedThis}</div>`
                    : (r.winner ? `<div class="winner">یک نفر ماند → برنده: ${r.winner}</div>` : '');
                return `<div class="round-display">
                    <div class="round-title">دور ${r.round} — باقی‌مانده: ${(r.active || []).join('، ')}</div>
                    <div class="votes">${votes}</div>
                    ${tail}
                </div>`;
            }).join('');
        }
        const lab = M.createLab({
            candidates: SEVEN,
            adderId: 'adder', candidateBarId: 'candBar', voterCountId: 'voterCount',
            voterListId: 'voterList', resetBtnId: 'resetBtn',
            graphId: 'graphCanvas', legendId: 'graphLegend',
            onRender(counts) {
                const cands = lab.state.candidates;
                const hr = M.hare(lab.state.voters, cands);
                const pl = M.plurality(lab.state.voters, cands);
                if (pl.counts) M.renderScoreBars(document.getElementById('bars'), pl.counts, cands);
                M.drawGraph(document.getElementById('graphCanvas'), counts, { candidates: cands, highlightWinner: hr.winner });
                const el = document.getElementById('out');
                const roundsEl = document.getElementById('rounds');
                if (!lab.state.voters.length) {
                    el.innerHTML = '';
                    roundsEl.innerHTML = '';
                    return;
                }
                el.innerHTML = `<div class="result-box ${hr.winner === 'A' ? 'win' : 'info'}">برنده نهایی: ${hr.winner || '—'}</div>`;
                roundsEl.innerHTML = roundsHtml(hr);
            }
        });
        document.getElementById('beforeBtn').addEventListener('click', () => { lab.setCandidates(SEVEN); lab.setVoters(before, true); });
        document.getElementById('afterBtn').addEventListener('click', () => { lab.setCandidates(SEVEN); lab.setVoters(after, true); });
        lab.setVoters(before, true);
    </script>
</body>
</html>
