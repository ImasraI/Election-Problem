<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استیت ۴.۵ – استقلال از گزینه‌های نامرتبط</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h2 class="cond-title">استقلال از گزینه‌های نامرتبط (IIA)</h2>

        <div class="side-compare">
            <div class="compare-col">
                <h3>حالت اول</h3>
                <div class="graph-wrap"><canvas id="g1" width="420" height="420"></canvas></div>
                <div class="graph-legend" id="l1"></div>
                <div id="b1"></div>
                <div class="result-box win">برنده: A &nbsp;|&nbsp; بازندهٔ مرتبط: B</div>
            </div>
            <div class="compare-col">
                <h3>حالت دوم</h3>
                <div class="graph-wrap"><canvas id="g2" width="420" height="420"></canvas></div>
                <div class="graph-legend" id="l2"></div>
                <div id="b2"></div>
                <div class="result-box loss">برنده: B</div>
            </div>
        </div>

        <div class="card" style="margin-top:16px;">
            <div class="card-header"><span>آرا</span></div>
            <div id="candBar"></div>
            <div id="adder"></div>
            <div class="row" style="margin-top:10px;">
                <button class="outline" id="load1" type="button">بارگذاری حالت اول</button>
                <button class="outline" id="load2" type="button">بارگذاری حالت دوم</button>
                <button class="outline" id="resetBtn" type="button" style="color:#ff5d7d;">حذف همه</button>
            </div>
            <div class="grid-2" style="margin-top:12px;">
                <div>
                    <div class="card-header"><span>رأی‌دهندگان</span><span class="badge" id="voterCount">۰</span></div>
                    <div class="voter-list" id="voterList"></div>
                </div>
                <div>
                    <div id="liveOut"></div>
                    <div class="graph-wrap"><canvas id="graphCanvas" width="420" height="420"></canvas></div>
                    <div class="graph-legend" id="graphLegend"></div>
                    <div id="bars"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script>
        const M = Mentor;
        const FIVE = ['A','B','C','D','E'];
        const profile1 = M.expandGroups([
            { n: 6, rank: 'A>B>C>D>E' },
            { n: 5, rank: 'B>A>C>D>E' },
            { n: 2, rank: 'D>E>A>B>C' },
            { n: 2, rank: 'E>D>A>B>C' }
        ]);
        const profile2 = M.expandGroups([
            { n: 3, rank: 'A>B>C>D>E' },
            { n: 3, rank: 'C>A>B>D>E' },
            { n: 5, rank: 'B>A>C>D>E' },
            { n: 2, rank: 'D>E>A>B>C' },
            { n: 2, rank: 'E>D>A>B>C' }
        ]);

        function paint(canvasId, legendId, barsId, voters, winner) {
            const counts = M.buildCounts(voters, FIVE);
            const pl = M.plurality(voters, FIVE);
            M.drawGraph(document.getElementById(canvasId), counts, { candidates: FIVE, highlightWinner: winner || pl.winner });
            document.getElementById(legendId).innerHTML = M.legendHtml(counts, { candidates: FIVE });
            M.renderScoreBars(document.getElementById(barsId), pl.counts, FIVE);
        }
        paint('g1', 'l1', 'b1', profile1, 'A');
        paint('g2', 'l2', 'b2', profile2, 'B');

        const lab = M.createLab({
            candidates: FIVE,
            adderId: 'adder', candidateBarId: 'candBar', voterCountId: 'voterCount',
            voterListId: 'voterList', resetBtnId: 'resetBtn',
            graphId: 'graphCanvas', legendId: 'graphLegend',
            onRender(counts) {
                const cands = lab.state.candidates;
                const pl = M.plurality(lab.state.voters, cands);
                if (pl.counts) M.renderScoreBars(document.getElementById('bars'), pl.counts, cands);
                const el = document.getElementById('liveOut');
                if (!lab.state.voters.length) { el.innerHTML = ''; return; }
                el.innerHTML = `<div class="result-box ${pl.winner === 'A' ? 'win' : (pl.winner === 'B' ? 'loss' : 'info')}">برنده رأیِ اول: ${pl.winner || '—'}</div>`;
                M.drawGraph(document.getElementById('graphCanvas'), counts, { candidates: cands, highlightWinner: pl.winner });
            }
        });
        document.getElementById('load1').addEventListener('click', () => { lab.setCandidates(FIVE); lab.setVoters(profile1, true); });
        document.getElementById('load2').addEventListener('click', () => { lab.setCandidates(FIVE); lab.setVoters(profile2, true); });
        lab.setVoters(profile1, true);
    </script>
</body>
</html>
