<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استیت ۵ – سنجش ایده‌ها</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h2>استیت ۵ – ایده‌ها را با پنج شرط بسنجید</h2>

        <div class="card">
            <div class="card-header">
                <span>ارسال روش (هر نفر یک بار)</span>
                <span class="badge" id="ideaCount">۰ ایده</span>
            </div>
            <textarea id="ideaInput" placeholder="روش رأی‌گیری خود را بنویسید"></textarea>
            <div class="row" style="margin-top:10px;">
                <button class="primary" id="addIdeaBtn" type="button">ثبت و ارزیابی</button>
                <button class="outline" id="examplesBtn" type="button">مثال‌های نقض</button>
            </div>
            <div id="evalStatus" class="text-muted" style="margin-top:10px;"></div>
            <div id="criteriaChart"></div>
        </div>

        <div class="card">
            <div class="card-header"><span>روش‌های کلاس</span></div>
            <div id="ideaList"></div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script src="workshop.js"></script>
    <script>
        const M = Mentor;
        const input = document.getElementById('ideaInput');
        const list = document.getElementById('ideaList');
        const count = document.getElementById('ideaCount');
        const statusEl = document.getElementById('evalStatus');
        const chartEl = document.getElementById('criteriaChart');
        const addBtn = document.getElementById('addIdeaBtn');
        const examplesBtn = document.getElementById('examplesBtn');
        let ideas = [];
        let selected = -1;
        let me = null;

        function hasFailed(idea) {
            return !!(idea && idea.criteria && Object.values(idea.criteria).some(v => !v));
        }
        function who(idea) {
            return `${idea.name || idea.username || ''} · ${idea.team || 'بدون تیم'} · ${idea.points || 0} امتیاز`;
        }

        function showChart(idea) {
            if (!idea || !idea.criteria) {
                M.renderCriteriaChart(chartEl, null, { empty: 'یک روش را ارزیابی کنید تا نمودار پنج شرط دیده شود.' });
                return;
            }
            M.renderCriteriaChart(chartEl, idea.criteria, {
                title: who(idea) + ' — «' + String(idea.text || '').slice(0, 48) + (String(idea.text || '').length > 48 ? '…' : '') + '»',
                examples: idea.examples || [],
                examplesFailed: !!(idea.examplesLoaded && !(idea.examples || []).length)
            });
        }

        function render() {
            count.textContent = ideas.length + ' ایده';
            if (selected >= ideas.length) selected = ideas.length - 1;
            if (selected < 0 && ideas.length) selected = ideas.length - 1;
            const used = !!(me && me.role !== 'admin' && me.used_state5);
            addBtn.disabled = used;
            input.disabled = used;
            if (used) statusEl.textContent = statusEl.textContent || 'سهمیه ارسال شما استفاده شده است.';
            if (!ideas.length) {
                list.innerHTML = '<div class="empty-state">هنوز کسی روشی نفرستاده است.</div>';
                M.renderCriteriaChart(chartEl, null, { empty: 'هنوز ایده‌ای نیست.' });
                examplesBtn.disabled = true;
                return;
            }
            list.innerHTML = ideas.map((item, i) => `
                <div class="idea-item ${i === selected ? 'active' : ''}" data-select="${i}">
                    <span class="badge">${i + 1}</span>
                    <div class="idea-text">
                        <strong>${M.escapeHtml(item.name || item.username)}</strong>
                        <span class="text-muted"> · ${M.escapeHtml(item.team || 'بدون تیم')}</span>
                        <div>${M.escapeHtml(item.text || '')}</div>
                    </div>
                    <span class="badge ${item.criteria ? (Object.values(item.criteria).every(Boolean) ? 'condorcet' : 'cycle') : ''}">
                        ${item.points || 0} امتیاز
                    </span>
                </div>`).join('');
            list.querySelectorAll('[data-select]').forEach(row => {
                row.addEventListener('click', () => {
                    selected = parseInt(row.dataset.select, 10);
                    showChart(ideas[selected]);
                    render();
                });
            });
            const idea = selected >= 0 ? ideas[selected] : null;
            const canEx = hasFailed(idea) && me && (me.role === 'admin' || idea.username === me.username);
            examplesBtn.disabled = !canEx;
        }

        async function addAndEvaluate() {
            const t = input.value.trim();
            if (!t) {
                statusEl.textContent = 'روش را بنویسید.';
                return;
            }
            addBtn.disabled = true;
            examplesBtn.disabled = true;
            statusEl.textContent = 'در حال ارزیابی پنج معیار…';
            try {
                const data = await Workshop.request('POST', '/api/evaluate', { prompt: t });
                const idea = data.idea;
                statusEl.textContent = hasFailed(idea)
                    ? `ثبت شد: ${idea.points} امتیاز. برای مثال نقض، دکمه «مثال‌های نقض» را بزنید.`
                    : `ثبت شد: ${idea.points} امتیاز. هر پنج شرط برقرار است.`;
                input.value = '';
                if (me) {
                    me.used_state5 = true;
                    me.points = idea.total_points || me.points;
                }
            } catch (err) {
                statusEl.textContent = err.message || String(err);
                addBtn.disabled = !!(me && me.role === 'admin');
            }
        }

        async function loadExamples() {
            const idea = selected >= 0 ? ideas[selected] : null;
            if (!hasFailed(idea)) {
                statusEl.textContent = 'ابتدا روشی را ارزیابی کنید که دست‌کم یک شرط نقض‌شده داشته باشد.';
                return;
            }
            examplesBtn.disabled = true;
            addBtn.disabled = true;
            statusEl.textContent = 'در حال گرفتن مثال‌های نقض…';
            try {
                const data = await Workshop.request('POST', '/api/examples', {
                    id: idea.id,
                    prompt: idea.text,
                    criteria: idea.criteria
                });
                statusEl.textContent = (data.examples || []).length ? '' : 'برای شرط‌های نقض‌شده مثالی برنگشت.';
            } catch (err) {
                statusEl.textContent = err.message || String(err);
            }
        }

        addBtn.addEventListener('click', addAndEvaluate);
        examplesBtn.addEventListener('click', loadExamples);

        Workshop.startPolling((data, changed) => {
            me = data.me;
            ideas = data.ideas || [];
            if (selected < 0 && me) {
                const mine = ideas.findIndex(item => item.username === me.username);
                if (mine >= 0) selected = mine;
            }
            if (changed) render();
        });
    </script>
</body>
</html>
