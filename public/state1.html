<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استیت ۱ – ایده‌های شما</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h2>استیت ۱ – ایده‌های شما</h2>

        <div class="card">
            <div class="card-header">
                <span>افزودن ایده</span>
                <span class="badge" id="ideaCount">۰ ایده</span>
            </div>
            <textarea id="ideaInput" placeholder="مثلاً: هر کس بیشترین رأی اول را داشت برنده است"></textarea>
            <div class="row" style="margin-top:10px;">
                <button class="primary" id="addIdeaBtn" type="button">ثبت ایده</button>
                <button class="outline" id="clearIdeasBtn" type="button">حذف همه</button>
            </div>
            <div id="evalStatus" class="text-muted" style="margin-top:10px;"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>فهرست روش‌های پیشنهادی</span>
            </div>
            <div id="ideaList"></div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script>
        const M = Mentor;
        const input = document.getElementById('ideaInput');
        const list = document.getElementById('ideaList');
        const count = document.getElementById('ideaCount');
        const addBtn = document.getElementById('addIdeaBtn');
        let ideas = M.loadIdeas().map(item => typeof item === 'string' ? { text: item } : item);

        function save() { M.saveIdeas(ideas); render(); }

        function render() {
            count.textContent = ideas.length + ' ایده';
            if (!ideas.length) {
                list.innerHTML = '<div class="empty-state">هنوز ایده‌ای ثبت نشده است.</div>';
                return;
            }
            list.innerHTML = ideas.map((item, i) => `
                <div class="idea-item">
                    <span class="badge">${i + 1}</span>
                    <input data-idx="${i}" value="${String(item.text || '').replace(/"/g, '&quot;')}">
                    <button class="remove-btn" data-idx="${i}" type="button">✕</button>
                </div>`).join('');
            list.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('change', () => {
                    const idx = parseInt(inp.dataset.idx, 10);
                    ideas[idx].text = inp.value.trim();
                    ideas[idx].criteria = null;
                    ideas[idx].examples = [];
                    ideas[idx].examplesLoaded = false;
                    save();
                });
            });
            list.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    ideas.splice(parseInt(btn.dataset.idx, 10), 1);
                    save();
                });
            });
        }

        addBtn.addEventListener('click', () => {
            const t = input.value.trim();
            if (!t) return;
            ideas.push({ text: t, criteria: null, examples: [], examplesLoaded: false });
            input.value = '';
            save();
        });
        document.getElementById('clearIdeasBtn').addEventListener('click', () => {
            ideas = [];
            save();
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addBtn.click();
            }
        });
        render();
    </script>
</body>
</html>
