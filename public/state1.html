<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استیت ۱ – ایده‌های شما</title>
    <link rel="stylesheet" href="shared.css" />
</head>
<body>
    <div class="container">
        <h2>استیت ۱ – ایده‌های کلاس</h2>

        <div class="card">
            <div class="card-header">
                <span>ایده شما (هر نفر یک بار)</span>
                <span class="badge" id="ideaCount">۰ ایده</span>
            </div>
            <textarea id="ideaInput" placeholder="مثلاً: هر کس بیشترین رأی اول را داشت برنده است"></textarea>
            <div class="row" style="margin-top:10px;">
                <button class="primary" id="addIdeaBtn" type="button">ثبت ایده</button>
            </div>
            <div id="evalStatus" class="text-muted" style="margin-top:10px;"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>فهرست روش‌های پیشنهادی همه</span>
            </div>
            <div id="ideaList"></div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script src="workshop.js"></script>
    <script>
        const M = Mentor;
        const input = document.getElementById('ideaInput');
        const list = document.getElementById('ideaList');
        const count = document.getElementById('ideaCount');
        const addBtn = document.getElementById('addIdeaBtn');
        const statusEl = document.getElementById('evalStatus');
        let ideas = [];
        let me = null;

        function isStaff(user) {
            return user && (user.role === 'admin' || user.role === 'owner');
        }
        function canDelete(item) {
            if (!me || !item) return false;
            return isStaff(me) || item.username === me.username;
        }

        function render() {
            count.textContent = ideas.length + ' ایده';
            const used = !!(me && me.role === 'student' && me.used_state1);
            addBtn.disabled = used;
            input.disabled = used;
            if (used) statusEl.textContent = statusEl.textContent || 'ایده شما ثبت شده است.';
            if (!ideas.length) {
                list.innerHTML = '<div class="empty-state">هنوز ایده‌ای ثبت نشده است.</div>';
                return;
            }
            list.innerHTML = ideas.map((item, i) => `
                <div class="idea-item">
                    <span class="badge">${i + 1}</span>
                    <div class="idea-text">
                        <strong>${M.escapeHtml(item.name || item.username)}</strong>
                        <span class="text-muted"> · ${M.escapeHtml(item.team || 'بدون تیم')}</span>
                        <div>${M.escapeHtml(item.text || '')}</div>
                    </div>
                    ${canDelete(item) ? `<div class="idea-actions"><button class="outline idea-del" type="button" data-del="${M.escapeHtml(item.id)}">حذف</button></div>` : ''}
                </div>`).join('');
            list.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', ev => {
                    ev.stopPropagation();
                    deleteIdea(btn.getAttribute('data-del'));
                });
            });
        }

        addBtn.addEventListener('click', async () => {
            const t = input.value.trim();
            if (!t) return;
            addBtn.disabled = true;
            try {
                await Workshop.request('POST', '/api/state1', { text: t });
                input.value = '';
                statusEl.textContent = 'ایده ثبت شد و برای کلاس شما دیده می‌شود.';
                if (me) me.used_state1 = true;
            } catch (err) {
                statusEl.textContent = err.message || String(err);
                addBtn.disabled = false;
            }
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addBtn.click();
            }
        });

        async function deleteIdea(id) {
            if (!id) return;
            if (!confirm('این ایده حذف شود؟')) return;
            statusEl.textContent = 'در حال حذف…';
            try {
                const data = await Workshop.request('POST', '/api/ideas/delete', { id, source: 'state1' });
                ideas = ideas.filter(item => item.id !== id);
                if (data && data.me) {
                    me = Object.assign({}, me || {}, data.me);
                    if (!me.used_state1) {
                        addBtn.disabled = false;
                        input.disabled = false;
                    }
                }
                statusEl.textContent = 'ایده حذف شد.';
                render();
            } catch (err) {
                statusEl.textContent = err.message || String(err);
            }
        }

        Workshop.startPolling((data, changed) => {
            me = data.me;
            ideas = data.state1_ideas || [];
            if (changed) render();
        });
    </script>
</body>
</html>
